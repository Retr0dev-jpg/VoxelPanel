name: voxel_panel
description: "VoxelPanel: creazione e gestione locale di server Minecraft."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  rust_lib_voxel_panel:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  flutter_riverpod: ^3.4.3
  file_picker: ^13.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/paper.png
