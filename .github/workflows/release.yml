name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-14-dev

      - name: Build
        shell: bash
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop
          flutter build ${{ matrix.platform }} --release

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path -LiteralPath "$release\voxel_panel.exe")) { throw "Missing voxel_panel.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\VoxelPanel-windows-x64.zip"

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf dist/VoxelPanel-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          app="build/macos/Build/Products/Release/VoxelPanel.app"
          test -d "$app"
          hdiutil create -volname VoxelPanel -srcfolder "$app" -ov -format UDZO dist/VoxelPanel-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: voxelpanel-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Published versions are never overwritten: bump `version` in pubspec.yaml to release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --title "VoxelPanel $TAG" \
            --generate-notes \
            --latest \
            --target "${{ github.sha }}"
